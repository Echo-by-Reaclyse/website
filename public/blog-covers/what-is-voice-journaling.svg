<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: deep navy -->
  <rect width="800" height="500" fill="#0E3272"/>

  <!-- Subtle grid overlay -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#FFFFFF" stroke-width="0.4" opacity="0.06"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#FFFFFF" stroke-width="0.4" opacity="0.06"/>

  <!-- Label -->
  <text x="80" y="84" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#FFE4B8" letter-spacing="0.18em" font-weight="700" opacity="0.9">A PLACE TO BEGIN</text>
  <line x1="80" y1="94" x2="240" y2="94" stroke="#BF6040" stroke-width="1.5" opacity="0.6"/>

  <!-- Main heading -->
  <text x="80" y="176" font-family="Georgia,serif" font-style="italic" font-size="56" fill="#FFF6E9" letter-spacing="-0.5">Your words.</text>
  <text x="80" y="240" font-family="Georgia,serif" font-style="italic" font-size="56" fill="#FFE4B8" letter-spacing="-0.5">At your pace.</text>

  <!-- Colorful waveform bars — centered horizontally, lower portion -->
  <g transform="translate(80, 310)">
    <!-- Bar group: varying heights, colorful stops -->
    <rect x="0"   y="48" width="18" height="16" rx="4" fill="#BF6040" opacity="0.40"/>
    <rect x="24"  y="36" width="18" height="28" rx="4" fill="#D4845C" opacity="0.55"/>
    <rect x="48"  y="20" width="18" height="44" rx="4" fill="#FFE4B8" opacity="0.75"/>
    <rect x="72"  y="8"  width="18" height="56" rx="4" fill="#FFF6E9" opacity="0.90"/>
    <rect x="96"  y="14" width="18" height="50" rx="4" fill="#FFE4B8" opacity="0.80"/>
    <rect x="120" y="28" width="18" height="36" rx="4" fill="#D4845C" opacity="0.65"/>
    <rect x="144" y="4"  width="18" height="60" rx="4" fill="#FFF6E9" opacity="0.95"/>
    <rect x="168" y="18" width="18" height="46" rx="4" fill="#FFE4B8" opacity="0.80"/>
    <rect x="192" y="32" width="18" height="32" rx="4" fill="#BF6040" opacity="0.60"/>
    <rect x="216" y="12" width="18" height="52" rx="4" fill="#F0A882" opacity="0.75"/>
    <rect x="240" y="24" width="18" height="40" rx="4" fill="#FFE4B8" opacity="0.70"/>
    <rect x="264" y="40" width="18" height="24" rx="4" fill="#BF6040" opacity="0.45"/>
    <rect x="288" y="16" width="18" height="48" rx="4" fill="#FFF6E9" opacity="0.85"/>
    <rect x="312" y="30" width="18" height="34" rx="4" fill="#D4845C" opacity="0.60"/>
    <rect x="336" y="8"  width="18" height="56" rx="4" fill="#FFE4B8" opacity="0.80"/>
    <rect x="360" y="22" width="18" height="42" rx="4" fill="#F0A882" opacity="0.70"/>
    <rect x="384" y="44" width="18" height="20" rx="4" fill="#BF6040" opacity="0.40"/>
    <rect x="408" y="12" width="18" height="52" rx="4" fill="#FFE4B8" opacity="0.75"/>
    <rect x="432" y="28" width="18" height="36" rx="4" fill="#D4845C" opacity="0.55"/>
    <rect x="456" y="6"  width="18" height="58" rx="4" fill="#FFF6E9" opacity="0.90"/>
    <rect x="480" y="20" width="18" height="44" rx="4" fill="#BF6040" opacity="0.65"/>
    <rect x="504" y="38" width="18" height="26" rx="4" fill="#FFE4B8" opacity="0.50"/>
    <rect x="528" y="14" width="18" height="50" rx="4" fill="#F0A882" opacity="0.70"/>
    <rect x="552" y="26" width="18" height="38" rx="4" fill="#D4845C" opacity="0.60"/>
    <rect x="576" y="42" width="18" height="22" rx="4" fill="#BF6040" opacity="0.40"/>
  </g>
</svg>
