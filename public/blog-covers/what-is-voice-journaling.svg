  <!-- Left text block -->
  <text x="80" y="158" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#A8907E" letter-spacing="3" text-transform="uppercase">VOICE JOURNALING</text>
  <text x="78" y="218" font-family="Georgia, serif" font-style="italic" font-size="52" fill="#1C110A" letter-spacing="-1">What is</text>
  <text x="78" y="270" font-family="Georgia, serif" font-style="italic" font-size="52" fill="#BF6040" letter-spacing="-1">voice journaling?</text>
  <text x="80" y="316" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#6B5244" font-weight="400">A beginner's complete guide</text>

  <!-- Decorative line -->
  <line x1="80" y1="140" x2="120" y2="140" stroke="#BF6040" stroke-width="1.5" opacity="0.6"/>
</svg>
