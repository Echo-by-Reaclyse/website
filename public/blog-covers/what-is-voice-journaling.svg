<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="bg1" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F2EBE3"/>
      <stop offset="100%" stop-color="#FAF6F1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg1)"/>

  <!-- Concentric rings (right side) -->
  <circle cx="560" cy="210" r="180" fill="none" stroke="#BF6040" stroke-width="0.8" opacity="0.10"/>
  <circle cx="560" cy="210" r="140" fill="none" stroke="#BF6040" stroke-width="0.8" opacity="0.15"/>
  <circle cx="560" cy="210" r="104" fill="none" stroke="#BF6040" stroke-width="1" opacity="0.22"/>
  <circle cx="560" cy="210" r="72" fill="none" stroke="#BF6040" stroke-width="1.2" opacity="0.32"/>
  <circle cx="560" cy="210" r="44" fill="none" stroke="#BF6040" stroke-width="1.5" opacity="0.45"/>

  <!-- Center mic dot -->
  <circle cx="560" cy="210" r="14" fill="#BF6040" opacity="0.85"/>

  <!-- Waveform bars under rings -->
  <g transform="translate(502,268)">
    <rect x="0"  y="12" width="4" height="6"  rx="2" fill="#BF6040" opacity="0.35"/>
    <rect x="8"  y="8"  width="4" height="10" rx="2" fill="#BF6040" opacity="0.50"/>
    <rect x="16" y="4"  width="4" height="14" rx="2" fill="#BF6040" opacity="0.65"/>
    <rect x="24" y="0"  width="4" height="18" rx="2" fill="#BF6040" opacity="0.80"/>
    <rect x="32" y="4"  width="4" height="14" rx="2" fill="#BF6040" opacity="0.65"/>
    <rect x="40" y="9"  width="4" height="9"  rx="2" fill="#BF6040" opacity="0.52"/>
    <rect x="48" y="5"  width="4" height="13" rx="2" fill="#BF6040" opacity="0.62"/>
    <rect x="56" y="2"  width="4" height="16" rx="2" fill="#BF6040" opacity="0.72"/>
    <rect x="64" y="6"  width="4" height="12" rx="2" fill="#BF6040" opacity="0.58"/>
    <rect x="72" y="11" width="4" height="7"  rx="2" fill="#BF6040" opacity="0.42"/>
    <rect x="80" y="14" width="4" height="4"  rx="2" fill="#BF6040" opacity="0.32"/>
    <rect x="88" y="10" width="4" height="8"  rx="2" fill="#BF6040" opacity="0.45"/>
    <rect x="96" y="6"  width="4" height="12" rx="2" fill="#BF6040" opacity="0.60"/>
