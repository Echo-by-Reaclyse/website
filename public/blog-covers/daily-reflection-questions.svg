<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: warm sand -->
  <rect width="800" height="500" fill="#F5D99A"/>

  <!-- Faint quote decoration -->
  <text x="520" y="420" font-family="Georgia,serif" font-size="320" fill="#BF6040" opacity="0.08" text-anchor="middle">"</text>

  <!-- Label -->
  <text x="80" y="120" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#6B4A2A" letter-spacing="0.18em" font-weight="700">FROM THE ARTICLE</text>
  <line x1="80" y1="134" x2="268" y2="134" stroke="#BF6040" stroke-width="2" opacity="0.55"/>

  <!-- Large serif question — dark navy for max contrast on sand -->
  <text x="80" y="226" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#0F1A2C" letter-spacing="-0.5">What was I</text>
  <text x="80" y="290" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#0F1A2C" letter-spacing="-0.5">wrong about</text>
  <text x="80" y="354" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#BF6040" letter-spacing="-0.5">today?</text>
</svg>
