<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE4B8"/>
      <stop offset="100%" stop-color="#F5D8A0"/>
    </linearGradient>
  </defs>
  <!-- Background: warm sand -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Decorative faint quote mark -->
  <text x="580" y="380" font-family="Georgia,serif" font-size="320" fill="#BF6040" opacity="0.06">"</text>

  <!-- Label -->
  <text x="80" y="128" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#8B6B58" letter-spacing="0.18em" font-weight="700">FROM THE ARTICLE</text>
  <line x1="80" y1="140" x2="240" y2="140" stroke="#BF6040" stroke-width="1.5" opacity="0.5"/>

  <!-- Large serif question -->
  <text x="80" y="230" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#1C110A" letter-spacing="-0.5">What was I</text>
  <text x="80" y="294" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#1C110A" letter-spacing="-0.5">wrong about</text>
  <text x="80" y="358" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#BF6040" letter-spacing="-0.5">today?</text>
</svg>
