<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="bg10" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#EDE4DA"/>
      <stop offset="100%" stop-color="#FAF6F1"/>
    </radialGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg10)"/>

  <!-- Clock face (right) -->
  <circle cx="620" cy="200" r="110" fill="white" fill-opacity="0.35" stroke="#BF6040" stroke-width="1" stroke-opacity="0.20"/>
  <circle cx="620" cy="200" r="100" fill="none" stroke="#BF6040" stroke-width="0.6" stroke-opacity="0.12"/>
  <!-- Hour ticks -->
  <line x1="620" y1="104" x2="620" y2="116" stroke="#BF6040" stroke-width="1.5" stroke-opacity="0.30"/>
  <line x1="716" y1="200" x2="704" y2="200" stroke="#BF6040" stroke-width="1.5" stroke-opacity="0.30"/>
  <line x1="620" y1="296" x2="620" y2="284" stroke="#BF6040" stroke-width="1.5" stroke-opacity="0.30"/>
  <line x1="524" y1="200" x2="536" y2="200" stroke="#BF6040" stroke-width="1.5" stroke-opacity="0.30"/>
  <!-- Clock hands (pointing to ~10:10 — classic "reflection time") -->
  <line x1="620" y1="200" x2="585" y2="138" stroke="#BF6040" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="620" y1="200" x2="655" y2="148" stroke="#BF6040" stroke-width="2" stroke-opacity="0.40" stroke-linecap="round"/>
  <circle cx="620" cy="200" r="5" fill="#BF6040" fill-opacity="0.50"/>
  <!-- "3 min" badge -->
  <rect x="570" y="220" width="100" height="26" rx="6" fill="#BF6040" fill-opacity="0.10" stroke="#BF6040" stroke-width="0.8" stroke-opacity="0.25"/>
  <text x="620" y="238" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#BF6040" font-weight="600" text-anchor="middle" opacity="0.65">3 MINUTES</text>

  <!-- Label -->
  <line x1="80" y1="98" x2="115" y2="98" stroke="#BF6040" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="80" y="86" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#A8907E" letter-spacing="3">DAILY PRACTICE</text>

  <!-- Headline -->
  <text x="78" y="155" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#1C110A" letter-spacing="-1">How to Reflect</text>
  <text x="78" y="207" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#BF6040" letter-spacing="-1">on Your Day</text>
  <text x="80" y="252" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#6B5244" opacity="0.75">A 3-minute practice that actually works</text>
</svg>
