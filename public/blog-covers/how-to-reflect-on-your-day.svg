<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: terracotta -->
  <rect width="800" height="500" fill="#BF6040"/>

  <!-- Subtle texture: faint circles -->
  <circle cx="680" cy="80" r="180" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12"/>
  <circle cx="680" cy="80" r="130" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.09"/>

  <!-- Back card (THEN) — slightly tilted, positioned left-center -->
  <g transform="rotate(-6, 290, 280)">
    <rect x="100" y="140" width="290" height="240" rx="10" fill="#FFF6E9" opacity="0.92"/>
    <text x="124" y="180" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#BF6040" letter-spacing="0.18em" font-weight="700">THEN</text>
    <line x1="124" y1="190" x2="370" y2="190" stroke="#E8D5BE" stroke-width="0.8"/>
    <text x="124" y="234" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#471A0D">I need more room</text>
    <text x="124" y="262" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#471A0D">for myself.</text>
  </g>

  <!-- Front card (NOW) — straight, overlapping -->
  <rect x="310" y="170" width="300" height="220" rx="10" fill="#FFFFFF"/>
  <rect x="310" y="170" width="300" height="220" rx="10" fill="none" stroke="#E8D5BE" stroke-width="1"/>
  <text x="336" y="210" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#0E3272" letter-spacing="0.18em" font-weight="700">NOW</text>
  <line x1="336" y1="220" x2="588" y2="220" stroke="#E8D5BE" stroke-width="0.8"/>
  <text x="336" y="264" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#1C110A">I made time for a</text>
  <text x="336" y="292" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#1C110A">quiet morning.</text>

  <!-- Label top left -->
  <text x="80" y="64" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#FFFFFF" letter-spacing="0.18em" font-weight="700" opacity="0.85">REFLECTION</text>
</svg>
