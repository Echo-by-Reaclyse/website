<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: very dark blue-green -->
  <rect width="800" height="500" fill="#0A1628"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="35%" cy="60%" r="55%">
    <stop offset="0%" stop-color="#1A2D50" stop-opacity="1"/>
    <stop offset="100%" stop-color="#0A1628" stop-opacity="1"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Label -->
  <text x="80" y="120" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#BF6040" letter-spacing="0.22em" font-weight="700">TRY ASKING</text>
  <line x1="80" y1="132" x2="190" y2="132" stroke="#BF6040" stroke-width="1.5" opacity="0.7"/>

  <!-- Large serif question -->
  <text x="80" y="222" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#FFE4B8" letter-spacing="-0.5">What exactly</text>
  <text x="80" y="286" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#FFF6E9" letter-spacing="-0.5">are you</text>
  <text x="80" y="350" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#F0C09A" letter-spacing="-0.5">worried about?</text>

  <!-- Small decorative circles bottom-right -->
  <circle cx="680" cy="400" r="60" fill="none" stroke="#BF6040" stroke-width="0.8" opacity="0.20"/>
  <circle cx="680" cy="400" r="40" fill="none" stroke="#BF6040" stroke-width="0.8" opacity="0.28"/>
  <circle cx="680" cy="400" r="22" fill="#BF6040" opacity="0.18"/>
</svg>
