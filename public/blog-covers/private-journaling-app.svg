<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: cool light gray-blue like design -->
  <rect width="800" height="500" fill="#EDEEF5"/>

  <!-- Main card -->
  <rect x="140" y="72" width="520" height="356" rx="16" fill="#FFFFFF"/>
  <rect x="140" y="72" width="520" height="356" rx="16" fill="none" stroke="#D8D4E8" stroke-width="1"/>

  <!-- Card heading -->
  <text x="200" y="130" font-family="Georgia,serif" font-size="24" fill="#0F1A2C" font-weight="400">Before you choose</text>
  <line x1="200" y1="148" x2="620" y2="148" stroke="#E0DBF0" stroke-width="1"/>

  <!-- Item 1 -->
  <text x="200" y="196" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040" letter-spacing="0.08em" font-weight="700">01</text>
  <text x="236" y="196" font-family="-apple-system,system-ui,sans-serif" font-size="17" fill="#0F1A2C" font-weight="400">Where is it stored?</text>
  <line x1="200" y1="220" x2="620" y2="220" stroke="#E0DBF0" stroke-width="1"/>

  <!-- Item 2 -->
  <text x="200" y="264" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040" letter-spacing="0.08em" font-weight="700">02</text>
  <text x="236" y="264" font-family="-apple-system,system-ui,sans-serif" font-size="17" fill="#0F1A2C" font-weight="400">Who can access it?</text>
  <line x1="200" y1="288" x2="620" y2="288" stroke="#E0DBF0" stroke-width="1"/>

  <!-- Item 3 -->
  <text x="200" y="332" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040" letter-spacing="0.08em" font-weight="700">03</text>
  <text x="236" y="332" font-family="-apple-system,system-ui,sans-serif" font-size="17" fill="#0F1A2C" font-weight="400">Can you delete it?</text>
  <line x1="200" y1="356" x2="620" y2="356" stroke="#E0DBF0" stroke-width="1"/>

  <!-- Item 4 -->
  <text x="200" y="400" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040" letter-spacing="0.08em" font-weight="700">04</text>
  <text x="236" y="400" font-family="-apple-system,system-ui,sans-serif" font-size="17" fill="#0F1A2C" font-weight="400">Is AI used on it?</text>

  <!-- Label -->
  <text x="140" y="46" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#6B6890" letter-spacing="0.14em" font-weight="700">PRIVACY</text>
</svg>
