<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF3EB"/>
      <stop offset="100%" stop-color="#F5E8D5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Large faint "35" watermark -->
  <text x="490" y="420" font-family="Georgia,serif" font-style="italic" font-size="280" fill="#BF6040" opacity="0.07" text-anchor="middle">35</text>

  <!-- Paper card -->
  <rect x="80" y="90" width="360" height="290" rx="12" fill="#FFFFFF" opacity="0.92"/>
  <rect x="80" y="90" width="360" height="290" rx="12" fill="none" stroke="#E8D5BE" stroke-width="1"/>

  <!-- Card content -->
  <text x="116" y="138" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#BF6040" letter-spacing="0.18em" font-weight="700">ONE QUESTION</text>
  <line x1="116" y1="150" x2="404" y2="150" stroke="#E8D5BE" stroke-width="1"/>
  <text x="116" y="210" font-family="Georgia,serif" font-style="italic" font-size="32" fill="#1C110A">What matters</text>
  <text x="116" y="252" font-family="Georgia,serif" font-style="italic" font-size="32" fill="#1C110A">to you today?</text>
  <circle cx="116" cy="306" r="3" fill="#BF6040" opacity="0.5"/>
  <circle cx="130" cy="306" r="3" fill="#BF6040" opacity="0.35"/>
  <circle cx="144" cy="306" r="3" fill="#BF6040" opacity="0.2"/>

  <!-- Right-side stacked cards (depth effect) -->
  <rect x="476" y="130" width="268" height="180" rx="10" fill="#FFF6E9" opacity="0.65" transform="rotate(-4, 610, 220)"/>
  <rect x="484" y="148" width="268" height="180" rx="10" fill="#FFF6E9" opacity="0.45" transform="rotate(-2, 618, 238)"/>
  <rect x="490" y="164" width="268" height="160" rx="10" fill="#FDF0E4" opacity="0.30" transform="rotate(1, 624, 244)"/>

  <!-- Label at top left -->
  <text x="80" y="54" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#A8907E" letter-spacing="0.14em" font-weight="600">PROMPTS &amp; PRACTICE</text>
</svg>
