  <!-- Streak counter badge -->
  <rect x="440" y="308" width="100" height="38" rx="10" fill="#BF6040" opacity="0.12"/>
  <text x="491" y="325" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#BF6040" text-anchor="middle" font-weight="600" letter-spacing="1">28 DAY</text>
  <text x="491" y="340" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#BF6040" text-anchor="middle" font-weight="600" letter-spacing="1">STREAK</text>

  <!-- Main headline -->
  <line x1="80" y1="96" x2="118" y2="96" stroke="#BF6040" stroke-width="1.5" opacity="0.6"/>
  <text x="80" y="84" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#A8907E" letter-spacing="3">HABIT BUILDING</text>
  <text x="78" y="152" font-family="Georgia, serif" font-style="italic" font-size="50" fill="#1C110A" letter-spacing="-1">Build a habit</text>
  <text x="78" y="204" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#BF6040">that actually sticks</text>
  <text x="80" y="248" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#6B5244" opacity="0.8">The science of journaling consistency</text>
</svg>
