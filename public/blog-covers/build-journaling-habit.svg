<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FFF6E9"/>

  <!-- Label -->
  <text x="80" y="84" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#6B5244" letter-spacing="0.18em" font-weight="700">DAILY PRACTICE</text>
  <line x1="80" y1="98" x2="248" y2="98" stroke="#BF6040" stroke-width="2" opacity="0.55"/>

  <!-- Title — dark navy for max contrast on cream -->
  <text x="80" y="174" font-family="Georgia,serif" font-style="italic" font-size="46" fill="#0F1A2C" letter-spacing="-0.5">Build the habit</text>
  <text x="80" y="230" font-family="Georgia,serif" font-style="italic" font-size="46" fill="#BF6040" letter-spacing="-0.5">one day at a time.</text>

  <!-- Week dots -->
  <g transform="translate(80, 278)">
    <circle cx="32"  cy="32" r="30" fill="#0F1A2C"/>
    <text x="32"  y="27" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#FFF6E9" text-anchor="middle" font-weight="700">M</text>
    <text x="32"  y="45" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040"  text-anchor="middle" font-weight="700">✓</text>

    <circle cx="106" cy="32" r="30" fill="#0F1A2C"/>
    <text x="106" y="27" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#FFF6E9" text-anchor="middle" font-weight="700">T</text>
    <text x="106" y="45" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040"  text-anchor="middle" font-weight="700">✓</text>

    <circle cx="180" cy="32" r="30" fill="#0F1A2C"/>
    <text x="180" y="27" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#FFF6E9" text-anchor="middle" font-weight="700">W</text>
    <text x="180" y="45" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040"  text-anchor="middle" font-weight="700">✓</text>

    <circle cx="254" cy="32" r="30" fill="#0F1A2C"/>
    <text x="254" y="27" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#FFF6E9" text-anchor="middle" font-weight="700">T</text>
    <text x="254" y="45" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040"  text-anchor="middle" font-weight="700">✓</text>

    <circle cx="328" cy="32" r="30" fill="#0F1A2C"/>
    <text x="328" y="27" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#FFF6E9" text-anchor="middle" font-weight="700">F</text>
    <text x="328" y="45" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#BF6040"  text-anchor="middle" font-weight="700">✓</text>

    <circle cx="402" cy="32" r="30" fill="none" stroke="#C4B49A" stroke-width="2"/>
    <text x="402" y="37" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#B0906A" text-anchor="middle" font-weight="700">S</text>

    <circle cx="476" cy="32" r="30" fill="none" stroke="#C4B49A" stroke-width="2"/>
    <text x="476" y="37" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#B0906A" text-anchor="middle" font-weight="700">S</text>
  </g>

  <text x="80" y="426" font-family="-apple-system,system-ui,sans-serif" font-size="14" fill="#6B5244">Five days. That is enough to start.</text>
</svg>
