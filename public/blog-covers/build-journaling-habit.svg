    <rect x="34"  y="136" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="68"  y="136" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="102" y="136" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="136" y="136" width="26" height="26" rx="6" fill="#EDE4DA" stroke="#BF6040" stroke-width="1.5" opacity="0.70"/>
    <rect x="170" y="136" width="26" height="26" rx="6" fill="#EDE4DA" stroke="#BF6040" stroke-width="1" opacity="0.40"/>
    <rect x="204" y="136" width="26" height="26" rx="6" fill="#EDE4DA" stroke="#BF6040" stroke-width="1" opacity="0.30"/>

    <!-- Check marks on filled cells (last row hint) -->
    <text x="13" y="154" font-family="system-ui" font-size="14" fill="white" opacity="0.5" text-anchor="middle">✓</text>
    <text x="47" y="154" font-family="system-ui" font-size="14" fill="white" opacity="0.5" text-anchor="middle">✓</text>
    <text x="81" y="154" font-family="system-ui" font-size="14" fill="white" opacity="0.5" text-anchor="middle">✓</text>
    <text x="115" y="154" font-family="system-ui" font-size="14" fill="white" opacity="0.5" text-anchor="middle">✓</text>
