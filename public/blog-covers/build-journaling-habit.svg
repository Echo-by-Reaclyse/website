<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="bg4" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F2EBE3"/>
      <stop offset="100%" stop-color="#FAF6F1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg4)"/>

  <!-- Habit tracker grid (right side) — 7 cols × 5 rows -->
