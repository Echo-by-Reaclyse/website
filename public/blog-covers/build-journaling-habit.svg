    <rect x="34"  y="0"  width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="68"  y="0"  width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="102" y="0"  width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="136" y="0"  width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="170" y="0"  width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="204" y="0"  width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <!-- Row 2 -->
    <rect x="0"   y="34" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="34"  y="34" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="68"  y="34" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="102" y="34" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="136" y="34" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="170" y="34" width="26" height="26" rx="6" fill="#EDE4DA" stroke="#BF6040" stroke-width="1" opacity="0.60"/>
    <rect x="204" y="34" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <!-- Row 3 -->
    <rect x="0"   y="68" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="34"  y="68" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="68"  y="68" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="102" y="68" width="26" height="26" rx="6" fill="#EDE4DA" stroke="#BF6040" stroke-width="1" opacity="0.55"/>
    <rect x="136" y="68" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="170" y="68" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="204" y="68" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <!-- Row 4 -->
    <rect x="0"   y="102" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="34"  y="102" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="68"  y="102" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="102" y="102" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="136" y="102" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="170" y="102" width="26" height="26" rx="6" fill="#BF6040" opacity="0.80"/>
    <rect x="204" y="102" width="26" height="26" rx="6" fill="#EDE4DA" stroke="#BF6040" stroke-width="1" opacity="0.50"/>
