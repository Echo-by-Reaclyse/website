<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <radialGradient id="bg5" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EDE4DA"/>
      <stop offset="100%" stop-color="#FAF6F1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg5)"/>

  <!-- iPhone silhouette (right) -->
  <rect x="520" y="60" width="160" height="300" rx="22" fill="white" opacity="0.55" stroke="#BF6040" stroke-width="1" stroke-opacity="0.15"/>
  <!-- iPhone notch -->
  <rect x="570" y="68" width="60" height="8" rx="4" fill="#EDE4DA" opacity="0.8"/>
  <!-- iPhone home indicator -->
  <rect x="562" y="346" width="76" height="4" rx="2" fill="#BF6040" opacity="0.25"/>
  <!-- App grid on iPhone screen -->
  <rect x="540" y="96"  width="36" height="36" rx="8" fill="#BF6040" opacity="0.70"/>
  <rect x="586" y="96"  width="36" height="36" rx="8" fill="#A04E30" opacity="0.55"/>
  <rect x="632" y="96"  width="36" height="36" rx="8" fill="#BF6040" opacity="0.35"/>
  <rect x="540" y="142" width="36" height="36" rx="8" fill="#A04E30" opacity="0.40"/>
  <rect x="586" y="142" width="36" height="36" rx="8" fill="#BF6040" opacity="0.60"/>
  <rect x="632" y="142" width="36" height="36" rx="8" fill="#BF6040" opacity="0.25"/>
  <rect x="540" y="188" width="36" height="36" rx="8" fill="#BF6040" opacity="0.30"/>
  <rect x="586" y="188" width="36" height="36" rx="8" fill="#A04E30" opacity="0.45"/>
  <rect x="632" y="188" width="36" height="36" rx="8" fill="#BF6040" opacity="0.55"/>
  <!-- "ÉCHO" label on first app -->
  <text x="558" y="119" font-family="Georgia, serif" font-style="italic" font-size="11" fill="white" opacity="0.9" text-anchor="middle">É</text>

  <!-- Star ratings row -->
  <g transform="translate(530, 258)">
    <text font-family="system-ui" font-size="18" fill="#BF6040" opacity="0.80">★★★★★</text>
  </g>
  <text x="530" y="298" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#BF6040" letter-spacing="1.5" opacity="0.6">EDITOR'S PICK 2026</text>

  <!-- Year badge -->
  <rect x="80" y="300" width="80" height="34" rx="8" fill="#BF6040" opacity="0.10" stroke="#BF6040" stroke-width="1" stroke-opacity="0.25"/>
  <text x="120" y="323" font-family="-apple-system, system-ui, sans-serif" font-size="15" fill="#BF6040" font-weight="700" text-anchor="middle">2026</text>

  <!-- Main headline -->
  <line x1="80" y1="94" x2="118" y2="94" stroke="#BF6040" stroke-width="1.5" opacity="0.6"/>
  <text x="80" y="82" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#A8907E" letter-spacing="3">COMPARISON</text>
  <text x="78" y="150" font-family="Georgia, serif" font-style="italic" font-size="46" fill="#1C110A" letter-spacing="-1">Best Journaling</text>
  <text x="78" y="200" font-family="Georgia, serif" font-style="italic" font-size="46" fill="#BF6040" letter-spacing="-1">Apps for iPhone</text>
  <text x="80" y="244" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#6B5244" opacity="0.75">Day One · Reflectly · Rosebud · ÉCHO</text>
</svg>
