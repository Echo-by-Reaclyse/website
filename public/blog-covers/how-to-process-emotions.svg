<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E9"/>
      <stop offset="100%" stop-color="#F5EDE0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Label -->
  <text x="80" y="84" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#8B6B58" letter-spacing="0.18em" font-weight="700">HOW IT WORKS</text>
  <line x1="80" y1="96" x2="230" y2="96" stroke="#BF6040" stroke-width="1.5" opacity="0.5"/>

  <!-- Three steps heading -->
  <text x="80" y="168" font-family="Georgia,serif" font-style="italic" font-size="42" fill="#1C110A" letter-spacing="-0.5">Three words.</text>
  <text x="80" y="220" font-family="Georgia,serif" font-style="italic" font-size="42" fill="#471A0D" letter-spacing="-0.5">One practice.</text>

  <!-- Three pill buttons -->
  <!-- Notice pill: sand/warm -->
  <rect x="80" y="268" width="160" height="52" rx="26" fill="#FFE4B8"/>
  <text x="160" y="300" font-family="-apple-system,system-ui,sans-serif" font-size="18" fill="#471A0D" text-anchor="middle" font-weight="700">Notice</text>

  <!-- Name pill: navy -->
  <rect x="260" y="268" width="160" height="52" rx="26" fill="#0E3272"/>
  <text x="340" y="300" font-family="-apple-system,system-ui,sans-serif" font-size="18" fill="#FFF6E9" text-anchor="middle" font-weight="700">Name</text>

  <!-- Respond pill: terracotta -->
  <rect x="440" y="268" width="176" height="52" rx="26" fill="#BF6040"/>
  <text x="528" y="300" font-family="-apple-system,system-ui,sans-serif" font-size="18" fill="#FFF6E9" text-anchor="middle" font-weight="700">Respond</text>

  <!-- Connecting arrows -->
  <line x1="244" y1="294" x2="258" y2="294" stroke="#C4A882" stroke-width="1.5"/>
  <polygon points="256,290 264,294 256,298" fill="#C4A882"/>
  <line x1="424" y1="294" x2="438" y2="294" stroke="#C4A882" stroke-width="1.5"/>
  <polygon points="436,290 444,294 436,298" fill="#C4A882"/>

  <!-- Sub caption -->
  <text x="80" y="394" font-family="-apple-system,system-ui,sans-serif" font-size="14" fill="#8B6B58" opacity="0.8">Not three things you know. Three things you do.</text>
</svg>
