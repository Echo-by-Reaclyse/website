<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Left half: deep navy — Speak -->
  <rect x="0" y="0" width="400" height="500" fill="#0E3272"/>
  <!-- Right half: warm cream — Write -->
  <rect x="400" y="0" width="400" height="500" fill="#FFF6E9"/>

  <!-- Left: Speak label -->
  <text x="60" y="72" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#FFE4B8" letter-spacing="0.18em" font-weight="700" opacity="0.8">SPEAK</text>

  <!-- Left: mini waveform -->
  <g transform="translate(60, 110)">
    <rect x="0"  y="22" width="10" height="20" rx="3" fill="#FFE4B8" opacity="0.50"/>
    <rect x="16" y="10" width="10" height="32" rx="3" fill="#FFE4B8" opacity="0.65"/>
    <rect x="32" y="2"  width="10" height="40" rx="3" fill="#FFF6E9" opacity="0.85"/>
    <rect x="48" y="8"  width="10" height="34" rx="3" fill="#FFE4B8" opacity="0.75"/>
    <rect x="64" y="16" width="10" height="26" rx="3" fill="#FFE4B8" opacity="0.60"/>
    <rect x="80" y="6"  width="10" height="36" rx="3" fill="#FFF6E9" opacity="0.80"/>
    <rect x="96" y="14" width="10" height="28" rx="3" fill="#FFE4B8" opacity="0.65"/>
    <rect x="112" y="24" width="10" height="18" rx="3" fill="#BF6040" opacity="0.55"/>
  </g>

  <!-- Left: descriptive text -->
  <text x="60" y="220" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#FFF6E9">Faster,</text>
  <text x="60" y="258" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#FFE4B8">more honest.</text>
  <text x="60" y="312" font-family="Georgia,serif" font-size="16" fill="#B8C4D8" opacity="0.75">First thought, unfiltered.</text>
  <text x="60" y="338" font-family="Georgia,serif" font-size="16" fill="#B8C4D8" opacity="0.75">No delete key.</text>

  <!-- Divider line -->
  <line x1="400" y1="0" x2="400" y2="500" stroke="#E8D5BE" stroke-width="1.5"/>

  <!-- Right: Write label -->
  <text x="456" y="72" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#6B5244" letter-spacing="0.18em" font-weight="700">WRITE</text>

  <!-- Right: text lines (representing writing) -->
  <rect x="456" y="112" width="200" height="3" rx="1.5" fill="#C4A882" opacity="0.55"/>
  <rect x="456" y="124" width="260" height="3" rx="1.5" fill="#C4A882" opacity="0.45"/>
  <rect x="456" y="136" width="180" height="3" rx="1.5" fill="#C4A882" opacity="0.55"/>
  <rect x="456" y="148" width="240" height="3" rx="1.5" fill="#C4A882" opacity="0.40"/>
  <rect x="456" y="160" width="210" height="3" rx="1.5" fill="#C4A882" opacity="0.50"/>

  <!-- Right: descriptive text -->
  <text x="456" y="220" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#1C110A">Slower,</text>
  <text x="456" y="258" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#471A0D">more considered.</text>
  <text x="456" y="312" font-family="Georgia,serif" font-size="16" fill="#8B6B58" opacity="0.85">Edits before you read it.</text>
  <text x="456" y="338" font-family="Georgia,serif" font-size="16" fill="#8B6B58" opacity="0.85">The inner editor runs.</text>
</svg>
