<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background: very dark -->
  <rect width="800" height="500" fill="#0F1A2C"/>

  <!-- Large solid terracotta circle, upper-right, partially clipped -->
  <circle cx="720" cy="80" r="220" fill="#BF6040" opacity="0.88"/>

  <!-- Horizontal dividing line -->
  <line x1="0" y1="280" x2="800" y2="280" stroke="#FFE4B8" stroke-width="0.8" opacity="0.25"/>

  <!-- Main text in lower half -->
  <text x="80" y="352" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#FFF6E9" letter-spacing="-0.5">Let the day</text>
  <text x="80" y="416" font-family="Georgia,serif" font-style="italic" font-size="52" fill="#FFE4B8" letter-spacing="-0.5">settle.</text>

  <!-- Small label at top left -->
  <text x="80" y="64" font-family="-apple-system,system-ui,sans-serif" font-size="11" fill="#FFE4B8" letter-spacing="0.18em" font-weight="700" opacity="0.75">EVENING PRACTICE</text>
</svg>
