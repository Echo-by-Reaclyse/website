  <!-- ── Right: waveform card ── -->

  <!-- Card ambient glow (behind card) -->
  <ellipse cx="880" cy="315" rx="190" ry="120" fill="url(#cardGlow)" filter="url(#glow)"/>

  <!-- Card container — nested SVG for clean clipping -->
  <svg x="640" y="165" width="480" height="300">
    <!-- Card background -->
    <rect width="480" height="300" rx="20"
      fill="#0E0B09" fill-opacity="0.96"/>
    <!-- Grain texture overlay (subtle) -->
    <rect width="480" height="300" rx="20"
      fill="#BF6040" fill-opacity="0.025"/>
    <!-- Card border -->
    <rect width="480" height="300" rx="20"
      fill="none" stroke="#BF6040" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Top highlight line -->
    <rect x="40" y="0" width="400" height="1" rx="0.5" fill="url(#cardTop)"/>

    <!-- Recording indicator dot -->
    <circle cx="40" cy="48" r="5" fill="#BF6040">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="54" y="53"
      font-family="'Arial', 'Helvetica Neue', sans-serif"
      font-size="11" letter-spacing="2.5"
      fill="#FFF6E9" fill-opacity="0.45">RECORDING</text>

