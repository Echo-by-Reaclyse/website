<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Prevent flash of wrong theme before React hydrates -->
    <script>
      (function () {
        var t = localStorage.getItem("echo-theme");
        if (t === "light") document.documentElement.classList.add("light");
        else if (t === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    <title>ÉCHO — The voice journal. Coming to iOS.</title>
    <meta name="description" content="ÉCHO by Réaclyse is a private voice journal for iPhone. Join the waitlist for the European launch." />
    <meta property="og:title" content="ÉCHO — The voice journal" />
    <meta property="og:description" content="A private journal, out loud. Coming to iOS in Europe." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
